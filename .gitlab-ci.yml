variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/simusa/${CI_COMMIT_TAG}"

stages:
  - tag
  - build
  - test
  - upload
  - release

build_rust_linux:
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  stage: build
  image: gitlab.laas.fr:4567/mescourrou/simusa:latest
  script:
    - cargo build -p simusa-cmd --release --target x86_64-unknown-linux-gnu
  artifacts:
    when: on_success
    paths:
      - target/x86_64-unknown-linux-gnu/release/simusa-cmd
  
build_python_linux:
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  stage: build
  image: gitlab.laas.fr:4567/mescourrou/simusa:latest
  script:
    - cd simusa-py
    - maturin build --release --target x86_64-unknown-linux-gnu
  artifacts:
    paths:
      - target/wheels/
    when: on_success

build_rust_windows:
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  stage: build
  image: gitlab.laas.fr:4567/mescourrou/simusa:latest
  script:
    - cargo build -p simusa-cmd --release --target x86_64-pc-windows-gnu
  artifacts:
    when: on_success
    paths:
      - target/x86_64-pc-windows-gnu/release/simusa-cmd
  
build_python_windows:
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  stage: build
  image: gitlab.laas.fr:4567/mescourrou/simusa:latest
  script:
    - cd simusa-py
    - maturin build --release --target x86_64-pc-windows-gnu
  artifacts:
    paths:
      - target/wheels/
    when: on_success

doc:
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_BRANCH == "master"   # Run this job when a tag is created
  stage: build
  image: gitlab.laas.fr:4567/mescourrou/simusa:latest
  before_script:
  ## Source: https://docs.gitlab.com/ee/ci/jobs/ssh_keys.html
    - command -v ssh-agent >/dev/null
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - chmod 400 "$SSH_KEY"
    - ssh-add "$SSH_KEY"
  script:
    - cargo doc --no-deps --document-private-items
    - scp -i $SSH_KEY -r target/doc/ $DOC_USER@$DOC_HOST:$DOC_PATH/rust
    # - ./generate_config_doc.py
    - cd doc/user_manual && sh ./make_doc.sh
    - scp -i $SSH_KEY -r site/ $DOC_USER@$DOC_HOST:$DOC_PATH/user

tests:
  only:
    - /^release/.*$/
  stage: test
  image: gitlab.laas.fr:4567/mescourrou/simusa:latest
  script:
    - source /env/bin/activate
    - maturin develop
    - ./prepare_release.sh

run_tools:
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  stage: test
  image: gitlab.laas.fr:4567/mescourrou/simusa:latest
  script:
    # - cargo build --verbose
    # - cargo build --all-features --verbose --release
    - cargo build -p simusa-tools --release
    - target/release/simusa-tools --generate-schema config.schema.json
  artifacts:
    when: on_success
    paths:
      - config.schema.json

upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
      - if: $CI_COMMIT_TAG && $CI_COMMIT_BRANCH == "master"
  script:
      - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file target/wheels/*.whl ${PACKAGE_REGISTRY_URL}/'
      - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file target/x86_64-pc-windows-gnu/release/simusa-cmd ${PACKAGE_REGISTRY_URL}/win/simusa'
      - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file target/x86_64-unknown-linux-gnu/release/simusa-cmd ${PACKAGE_REGISTRY_URL}/linux/simusa'
      - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file config.schema.json ${PACKAGE_REGISTRY_URL}/config.schema.json'


release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_BRANCH == "master"   # Run this job when a tag is created
  script:
    - echo "running release_job"
  release:                               # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
    tag_name: '$CI_COMMIT_TAG'
    description: '$(git log -1 --pretty=%B | tail -n +3)'
    assets:
      links:
        - name: Python package Windows
          url: "${PACKAGE_REGISTRY_URL}/simusa-${CI_COMMIT_TAG}-cp310-abi3-win_amd64.whl"
          link_type: package
        - name: Python package Linux
          url: "${PACKAGE_REGISTRY_URL}/simusa-${CI_COMMIT_TAG}-cp310-abi3-linux_x86_64.whl"
          link_type: package
        - name: Command line binary linux
          url: "${PACKAGE_REGISTRY_URL}/linux/simusa"
          link_type: package
        - name: Command line binary windows
          url: "${PACKAGE_REGISTRY_URL}/win/simusa"
          link_type: package
        - name: Schema JSON
          url: "${PACKAGE_REGISTRY_URL}/config.schema.json"
          link_type: other

tag_release:
  stage: tag
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      # Get last commit message
      COMMIT_MSG=$(git log -1 --pretty=%s)

      # Check if last message contains "Release x.y.z"
      if [[ "$COMMIT_MSG" =~ Release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+) ]]; then
        VERSION="${BASH_REMATCH[1]}"
        echo "Detected version : $VERSION"

        # Tag creation
        git tag "$VERSION"

        # Push tag
        git push origin "$VERSION"
      else
        echo "No version detected in the commit message."
      fi