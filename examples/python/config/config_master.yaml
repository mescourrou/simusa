# yaml-language-server: $schema=../../../config.schema.json
log:
  log_level: #!Internal ["All"]
    type: Debug
results:
  result_path: "result.json"
  analyser:
    type: Python
    show_figures: false # Disabled for automatic testing
    script_path: "../../../config_example/analyse_results.py"
    function_name: "analyse_results"
    additionnal_params:
      figures_path: "figures"
time_analysis:
  exporter:
    type: TraceEventExporter
  output_path: "time_performance"
max_time: 60.
robots:
  - name: "robot1"
    navigator: 
      type: GoTo
      target_speed: 0.5
    state_estimator: 
      type: Perfect
      prediction_activation:
        period: {type: Num, value: 0.1}
computation_units:
  - name: "master"
    state_estimators:
      - name: "master"
        config:
          type: External

