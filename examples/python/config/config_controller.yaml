# yaml-language-server: $schema=../../../config.schema.json
log:
  log_level:
    type: Debug
results:
  result_path: "result.json"
  analyser:
    type: Python
    show_figures: false # Disabled for automatic testing
    script_path: "../../../config_example/analyse_results.py"
    function_name: "analyse_results"
    additionnal_params:
      figures_path: "figures"
time_analysis:
  exporter:
    type: TraceEventExporter
  output_path: "time_performance"
max_time: 60.

nodes:
  - name: "robot1"
    type: Robot
    navigator: 
      type: TrajectoryFollower
      trajectory: !include "paths/path1.yaml"
      target_speed: 0.5
      forward_distance: 0.2
    controller: 
      type: Plugin
      speed: 5
  - name: "robot2"
    type: Robot
    navigator: 
      type: TrajectoryFollower
      trajectory: !include "paths/path1.yaml"
      target_speed: 0.5
      forward_distance: 0.2
    controller: 
      type: PID
      proportional_gains: [1.0, 6.0]