name: drone1
type: Robot
navigator: 
  type: TrajectoryFollower
  trajectory: !include paths/path1.yaml
  forward_distance: 0.2
  target_speed: 1.
  stop_distance: 0.2
  stop_ramp_coefficient: 0.5
controller: 
  type: PID
physics: 
  type: Internal
  model: 
    type: Holonomic
sensor_manager:
  sensors:
  - name: OdomSensor
    config: 
      type: Speed
      activation_time:
        period: {type: Num, value: 0.1}