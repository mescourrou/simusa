# yaml-language-server: $schema=../config.schema.json
version: 1.8.1
log:
  included_nodes: []
  excluded_nodes: []
  log_level:
    type: Info
  outputs:
    - type: Console
    - type: File
      value: "simulator.log"
results:
  result_path: "results.json"
max_time: 60.0
time_analysis:
  exporter:
    type: TraceEventExporter
  output_path: time_performance
  analysis_unit: s
random_seed: null
environment:
  map_path: maps/landmarks_square.yaml
robots:
- !include robot1.yaml
- !include robot2.yaml
- !include drone1.yaml
computation_units:
- name: Central Unit
  network:
    range: 0.0
    reception_delay: 0.0
  state_estimators:
  - name: central_perfect
    config: 
      type: Perfect
      prediction_activation:
        period: {type: Num, value: 0.1}
      targets:
      - robot1
      - robot2