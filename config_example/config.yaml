# yaml-language-server: $schema=../config.schema.json
version: 1.10.0
log:
  included_nodes: []
  excluded_nodes: []
  log_level:
    type: Info
  outputs:
    - type: File
      value: "simulator.log"
results:
  result_path: "results.json"
  analyser:
    type: Python
    show_figures: false # Disabled for automatic testing
    script_path: "analyse_results.py"
    function_name: "analyse_results"
    additionnal_params:
      figures_path: "figures"
max_time: 60.0
time_analysis:
  exporter:
    type: TraceEventExporter
  output_path: time_performance
  analysis_unit: s
random_seed: null
environment:
  map: !include maps/landmarks_square.yaml
nodes:
- !include robot1.yaml
- !include robot2.yaml
- !include drone1.yaml
- name: Central Unit
  type: ComputationUnit
  network:
    range: 0.0
    reception_delay: 0.0
  state_estimators:
  - name: central_perfect
    config: 
      type: Perfect
      prediction_activation:
        period: {type: Num, value: 0.1}
      targets:
      - robot1
      - robot2