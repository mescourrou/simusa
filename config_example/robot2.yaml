name: robot2
type: Robot
navigator: 
  type: TrajectoryFollower
  trajectory: !include paths/path1.yaml
  forward_distance: 0.2
  target_speed: 0.3
  stop_distance: 0.2
  stop_ramp_coefficient: 0.5
controller: 
  type: PID
physics: 
  type: Internal
  model: 
    type: Unicycle
    wheel_distance: 0.25
  initial_state:
    pose:
    - 0.0
    - 0.0
    - 0.0
    velocity: [0.0, 0.0]
  faults: []
state_estimator: 
  type: Perfect
  prediction_activation: 
    period: {type: Num, value: 0.1}
  targets:
  - self
sensor_manager:
  sensors:
  - name: RobotSensor
    send_to:
    - Central Unit
    config: 
      type: Robot
      detection_distance: 100.0
      activation_time:
        period: {type: Num, value: 0.1}
      faults: []
      filters:
        - type: Range
          variables: [x, y]
          min_range: [0, -1]
          max_range: [10, 1]
  - name: SpeedSensor
    config: 
      type: Speed
      activation_time:
        period: {type: Num, value: 0.1}
network:
  range: 0.0
  reception_delay: 0.0
state_estimator_bench: []