name: robot1
navigator: 
  type: TrajectoryFollower
  trajectory: !include paths/path1.yaml
  forward_distance: 0.2
  target_speed: 0.5
  stop_distance: 0.2
  stop_ramp_coefficient: 0.5
controller: 
  type: PID
physics: 
  type: Internal
  model: 
    type: Unicycle
    wheel_distance: 0.25
  initial_state:
    pose:
    - 0.0
    - 0.0
    - 0.0
    velocity: [0.0, 0.0]
  faults:
  - type: AdditiveRobotCentered
    distributions:
    - type: Normal
      mean:
      - 0.0
      - 0.0
      covariance:
      - 0.1
      - 0.0
      - 0.0
      - 0.1
    variable_order:
    - x
    - y
state_estimator:
  type: Perfect
  prediction_activation: 
    period: {type: Num, value: 0.1}
  targets:
  - self
sensor_manager:
  sensors:
  - name: RobotSensor
    send_to:
    - Central Unit
    config:
      type: Robot
      detection_distance: 100.0
      activation_time:
        period: {type: Num, value: 0.1}
      faults: []
  - name: LandmarkSensor
    config: 
      type: OrientedLandmark
      detection_distance: 10.0
      activation_time:
        period: {type: Num, value: 0.1}
      faults:
      - type: AdditiveRobotCentered
        apparition:
          probability:
          - 1.0
        distributions:
        - type: Normal
          mean:
          - 0.0
          - 0.0
          - 0.0
          covariance:
          - 0.01
          - 0.0
          - 0.0
          - 0.0
          - 0.01
          - 0.0
          - 0.0
          - 0.0
          - 0.01
        variable_order:
        - x
        - y
        - orientation
network:
  range: 0.0
  reception_delay: 0.0
state_estimator_bench: []