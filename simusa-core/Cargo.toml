[package]
name = "simusa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
resolver = "2"
description.workspace = true
readme.workspace = true
repository.workspace = true

[lib]
name = "simusa"  # Python imports as 'simusa', Rust uses package name 'simusa-core'
crate-type = ["cdylib", "rlib"]  # cdylib for Python, rlib for Rust deps and tests
doctest = false

[features]
default = ["gui"]
gui = ["egui", "eframe"] # Enable GUI features
schema = ["schemars"]  # Enable schemars for schema generation
force_hard_determinism = []  # Disable features that may introduce non-determinism
debug_mode = ["simusa-com/debug_mode"]  # Enable heavy debug logs
monothreaded = []  # Force single-threaded execution

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Workspace dependencies (local)
simusa-macros = { path = "../simusa-macros", version = "1.9.1" }
simusa-com = { path = "../simusa-com", version = "1.9.1", default-features =  false }

# Main dependencies (alphabetical order)
colored = "3.0.0"
config-checker = "0.4.1"
confy = {"version" = "1.0.0", features = ["yaml_conf"], default-features = false }
constcat = "0.6.1"
csv = "1.4.0"
lazy_static = "1.5.0"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
pyo3 = { version = "0.27.2", features = ["abi3", "abi3-py310"] }
rand = "0.8.5"  # Major changes in rand, which need further look in the distributions implementations
rand_chacha = "0.3.1"
regex = "1.12.2"
rsdoc = "0.3.0"
scoped_threadpool = "0.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
subenum = "1.1.3"
statrs = "0.17.1"
paste = "1.0.15"
yaml-include = "0.8.1"

# Optional dependencies (alphabetical order)
eframe = { version = "0.33.0", default-features = false, optional = true, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # Enables wayland support and fixes clipboard issue.
    "x11",           # Enables x11 support and fixes clipboard issue on linux.
] }
egui = { version = "0.33.0", optional = true }
schemars = { version = "1.1.0", optional = true }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"



[[example]]
name = "basic"
path = "../examples/basic.rs"

[[example]]
name = "python_external"
path = "../examples/python_external.rs"

[[example]]
name = "gui"
required-features = ["gui"]
path = "../examples/gui.rs"


[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "base"
harness = false
