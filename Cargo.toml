# Workspace
[workspace]
members = [
    "simusa-cmd",
    "simusa-com",
    "simusa-core",
    "simusa-macros",
    "simusa-tools",
    "examples/stacked_plugins",
    "examples/plugin",
]
default-members = [
    "simusa-cmd",
    "simusa-com",
    "simusa-core",
    "simusa-macros",
    "simusa-tools"
    ]

resolver = "2"

[workspace.package]
version = "1.8.1"
edition = "2024"
authors = ["Maxime Escourrou <maxime.escourrou@laas.fr>"]
license = "MIT"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]



